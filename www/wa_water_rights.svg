<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <!-- Washington State outline (simplified but recognizable) -->
  <!-- Key features: straight N border, Olympic Peninsula NW, Puget Sound indent, Columbia River S border -->
  <path d="
    M 18,12
    L 88,12
    L 88,72
    L 72,78
    L 52,74
    L 35,78
    L 20,72
    L 12,60
    L 8,46
    L 12,34
    L 10,22
    L 18,18
    Z"
    fill="#1a3a5c"
    stroke="white"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Puget Sound indent suggestion -->
  <path d="M 18,18 L 24,28 L 20,38 L 26,44"
    fill="none"
    stroke="white"
    stroke-width="1"
    stroke-opacity="0.5"
  />

  <!-- Water drop centered on state -->
  <!-- Drop body -->
  <path d="M 52,30 C 52,30 36,50 36,60 C 36,69 43,76 52,76 C 61,76 68,69 68,60 C 68,50 52,30 52,30 Z"
    fill="#5bb8f5"
    stroke="white"
    stroke-width="1.5"
  />

  <!-- Shine highlight on drop -->
  <ellipse cx="46" cy="52" rx="4" ry="6"
    fill="white"
    fill-opacity="0.35"
    transform="rotate(-20 46 52)"
  />

</svg>
